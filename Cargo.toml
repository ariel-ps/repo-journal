[package]
name = "repo-journal"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Git-root .journal/ scratch CLI for agent investigations"

[[bin]]
name = "repo-journal"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_toon_format = "0.2"

[dev-dependencies]
tempfile = "3.14"
