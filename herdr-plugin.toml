id = "dev.ariel.repo-journal"
name = "Repo Journal"
version = "0.4.0"
min_herdr_version = "0.9.3"
description = "AXI .journal/ CLI for agent investigations (git-root scratch, gitignored by default)."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "./scripts/build/install.sh"]

[[actions]]
id = "dashboard"
title = "Journal dashboard"
contexts = ["pane", "workspace"]
command = ["zsh", "-c", "source ./shell.zsh && repo-journal"]

[[actions]]
id = "list"
title = "List journal entries"
contexts = ["pane", "workspace"]
command = ["zsh", "-c", "source ./shell.zsh && repo-journal list"]
