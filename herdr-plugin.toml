id = "dev.ariel.herdr-journal"
name = "Journal"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Lightweight .journal/ CLI for agent investigations, with a bundled skill."
platforms = ["macos", "linux"]

[[actions]]
id = "list"
title = "List journal entries"
contexts = ["pane", "workspace"]
command = ["zsh", "-c", "source ./shell.zsh && herdr-journal list"]
