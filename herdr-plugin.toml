id = "dev.ariel.journal-repo"
name = "Journal Repo"
version = "0.8.2"
min_herdr_version = "0.9.3"
description = "Git-root .journal/ CLI journal-repo (Treehouse-only). Human output; gitignored scratch on main checkout."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "./scripts/build/install.sh"]

[[actions]]
id = "dashboard"
title = "Journal dashboard"
contexts = ["pane", "workspace"]
command = ["zsh", "-c", "source ./shell.zsh && journal-repo"]

[[actions]]
id = "list"
title = "List journal entries"
contexts = ["pane", "workspace"]
command = ["zsh", "-c", "source ./shell.zsh && journal-repo list"]
